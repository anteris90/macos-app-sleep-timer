<svg width="1200" height="1140" viewBox="0 0 1200 1140" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Sleep Timer application screenshot mockup</title>
  <desc id="desc">A stylized mockup of the Sleep Timer macOS app showing the selected app, timer presets, monitor panel, console output, and start and reset buttons.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="1140" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1B1214"/>
      <stop offset="1" stop-color="#120B0C"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#342829"/>
      <stop offset="1" stop-color="#2B2122"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" stroke="#2A1B1D" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1200" height="1140" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="1140" rx="26" fill="url(#grid)" opacity="0.32"/>

  <circle cx="34" cy="34" r="10" fill="#F26F62"/>
  <circle cx="64" cy="34" r="10" fill="#EAB35D"/>
  <circle cx="94" cy="34" r="10" fill="#7FC65D"/>

  <text x="30" y="82" fill="#F18374" font-family="Menlo, Monaco, monospace" font-size="28" font-weight="700">sleep-timer&gt;</text>
  <text x="30" y="142" fill="#F8F3EE" font-family="Menlo, Monaco, monospace" font-size="58" font-weight="700">Sleep Timer</text>
  <text x="30" y="190" fill="#D8C8C1" font-family="Menlo, Monaco, monospace" font-size="22">A focused timer panel for gracefully closing one selected app.</text>

  <rect x="1080" y="34" width="84" height="42" rx="21" fill="#4A3839" stroke="#94706B"/>
  <text x="1104" y="61" fill="#E7D9D0" font-family="Menlo, Monaco, monospace" font-size="18" font-weight="700">IDLE</text>

  <g filter="url(#shadow)">
    <rect x="30" y="238" width="1140" height="390" rx="24" fill="url(#panel)" stroke="#8C6662" stroke-width="2"/>
  </g>

  <text x="54" y="284" fill="#D9C7C0" font-family="Menlo, Monaco, monospace" font-size="22" font-weight="700">SELECTED APP</text>
  <rect x="190" y="254" width="88" height="40" rx="20" fill="#281F20" stroke="#A77B74" stroke-width="2"/>
  <text x="208" y="280" fill="#F9F0EB" font-family="Menlo, Monaco, monospace" font-size="22" font-weight="700">Safari</text>

  <rect x="54" y="316" width="1060" height="64" rx="18" fill="#261D1E" stroke="#8C6662" stroke-width="2"/>
  <text x="356" y="356" fill="#E8D9D1" font-family="Menlo, Monaco, monospace" font-size="24" font-weight="700">Choose App</text>
  <text x="760" y="356" fill="#E8D9D1" font-family="Menlo, Monaco, monospace" font-size="24" font-weight="700">Save as Default</text>

  <line x1="54" y1="402" x2="1144" y2="402" stroke="#705152" stroke-width="2"/>

  <text x="54" y="444" fill="#D9C7C0" font-family="Menlo, Monaco, monospace" font-size="22" font-weight="700">CLOSE AFTER</text>
  <rect x="54" y="482" width="1060" height="62" rx="18" fill="#261D1E" stroke="#8C6662" stroke-width="2"/>
  <rect x="62" y="490" width="536" height="46" rx="12" fill="#6A3D3A"/>
  <text x="288" y="522" fill="#F18273" font-family="Menlo, Monaco, monospace" font-size="24" font-weight="700">Presets</text>
  <text x="807" y="522" fill="#E8D9D1" font-family="Menlo, Monaco, monospace" font-size="24" font-weight="700">Custom</text>

  <rect x="54" y="566" width="1060" height="62" rx="18" fill="#261D1E" stroke="#8C6662" stroke-width="2"/>
  <rect x="272" y="572" width="216" height="50" rx="12" fill="#6A3D3A"/>
  <text x="130" y="607" fill="#E8D9D1" font-family="Menlo, Monaco, monospace" font-size="24" font-weight="700">15 min</text>
  <text x="346" y="607" fill="#F18273" font-family="Menlo, Monaco, monospace" font-size="24" font-weight="700">30 min</text>
  <text x="560" y="607" fill="#E8D9D1" font-family="Menlo, Monaco, monospace" font-size="24" font-weight="700">45 min</text>
  <text x="774" y="607" fill="#E8D9D1" font-family="Menlo, Monaco, monospace" font-size="24" font-weight="700">60 min</text>
  <text x="994" y="607" fill="#E8D9D1" font-family="Menlo, Monaco, monospace" font-size="24" font-weight="700">90 min</text>

  <g filter="url(#shadow)">
    <rect x="30" y="656" width="1140" height="248" rx="24" fill="url(#panel)" stroke="#8C6662" stroke-width="2"/>
  </g>
  <text x="54" y="700" fill="#D9C7C0" font-family="Menlo, Monaco, monospace" font-size="22" font-weight="700">MONITOR</text>
  <text x="54" y="754" fill="#F8F3EE" font-family="Menlo, Monaco, monospace" font-size="46" font-weight="700">Ready</text>
  <text x="54" y="806" fill="#E0D0C9" font-family="Menlo, Monaco, monospace" font-size="24">Safari is currently running and can be closed by the timer.</text>
  <text x="54" y="852" fill="#D9C7C0" font-family="Menlo, Monaco, monospace" font-size="22" font-weight="700">progress</text>
  <rect x="54" y="870" width="1060" height="12" rx="6" fill="#463536"/>
  <rect x="54" y="870" width="8" height="12" rx="6" fill="#F18273"/>

  <g filter="url(#shadow)">
    <rect x="30" y="930" width="1140" height="108" rx="24" fill="url(#panel)" stroke="#8C6662" stroke-width="2"/>
  </g>
  <text x="54" y="974" fill="#D9C7C0" font-family="Menlo, Monaco, monospace" font-size="22" font-weight="700">CONSOLE OUTPUT</text>
  <text x="54" y="1020" fill="#F8F3EE" font-family="Menlo, Monaco, monospace" font-size="24">Loaded default app: Safari. Choose a duration, then start the timer.</text>

  <rect x="30" y="1064" width="178" height="52" rx="16" fill="#5D312F" stroke="#F18273" stroke-width="2"/>
  <text x="88" y="1098" fill="#F18273" font-family="Menlo, Monaco, monospace" font-size="24" font-weight="700">Start</text>
  <rect x="226" y="1064" width="202" height="52" rx="16" fill="#261D1E" stroke="#8C6662" stroke-width="2"/>
  <text x="295" y="1098" fill="#F8F3EE" font-family="Menlo, Monaco, monospace" font-size="24" font-weight="700">Reset</text>
</svg>
